# nginx-net2.conf - the room service's conversation as a WebSocket on port 443, for networks
# that let HTTPS out but break TLS to the service's own port (docs/issues/native-rendezvous.md,
# "The fallback").  Goes INSIDE the existing `server { listen 443 ssl ...; server_name
# <server-host>; }` block of that host name's site (nothing else of the site changes).  The
# service listens on the Unix socket with --ws-unix (champions-net2.service: RuntimeDirectory).
# Clients find it by themselves at wss://<server-host>/net2 when the direct link fails.
	location = /net2 {
		proxy_pass http://unix:/run/champions-net2/ws.sock:/net2;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_buffering off;
	}
