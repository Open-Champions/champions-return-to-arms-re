; model_remaster.cfg - our own choices for model_remaster.gd (look.remaster_models): how each of the game's figures is
; remastered.  No data of the game is in this file: sections are figure names of ours, the keys our numbers.
;
; Sections, each over the one before: [default], then the figure's kind and name - [player], [player.<class>] (barbarian,
; cleric, shadowknight, ranger, wizard, berserker, shaman), [player.<class>.<n>] (n: the figure chosen at the start,
; 0..11), [creature], [creature.<Class>] (the class names of
; er_creatures.cfg, e.g. Goblin, Orc, Spider...).
;
;   off       true: this figure stays the game's own
;   levels    1..3: how many times the triangles are split 1 -> 4 at most
;   max_tris  the finest level's triangles at most (a dense model is split fewer times)
;   crease    a cosine: where the game's own normals part by more than this across an edge, it stays a hard edge
;   fit       iterations fitting the smooth surface back through the game's own vertices (0: plain Loop, which shrinks)
;   keep      0..1: how much of the difference each iteration takes back
;   lod_near  units from the eye within which the finest level is drawn; beyond, the level below it (not the game's own)
;   lod_far   ... out to here; beyond, the game's own mesh (level 0)
;   strength  of the relief derived from the texture (normal map)
;   metal     0..1: the metalness of what reads as metal;  rough: a multiplier of the roughness
;   gain, bump, cavity, game_light   of the shader (shaders/remaster_model.gdshader)
;   fine      in a crowd, only this many figures nearest the eye get the finest level (the rest the one below it)
;
; The classes of the texels (by colour, contrast, streaks; rta_remaster.cpp, analyse): skin, leather, metal, cloth,
; hair, fur, stone.
;   class / part<N> / tex<K>   a class, "auto", or "auto:<class>" (by colour, but what would be leather, cloth or strands
;             is that class: a picture of a body is "auto:skin"); tex<K> is the figure's K-th texture in the order of its
;             packets (RTA_REMASTER_DUMP=<folder> writes each texture's picture and classes under that number)
;   shiny     the class of a packet the game draws with an environment map under it ("": as any other; the players
;             have one under most packets, a sheen; a black widow's legs are chrome)
;   rules, tex<K>_rules   ["<class> hue0 hue1 sat0 sat1 val0 val1", ...]: texels in that colour box are that class
;   strands   hair | fur: what streaked texels are;  gold, grey_metal: whether ochre / grey worked texels may be metal
;   skin_hue_lo, skin_hue_hi, skin_v_lo, skin_s_hi   the colour band of skin (hue 0..1 from red)
;   sss, sheen, spec   skin's warm falloff, the strands' sheen, the highlights
;   game_match 0..1   the figure as bright as the game's own (the game's light on it, in the game's own gamma, is the
;             diffuse; 0: lit as the outfits are);  scene_keep   how much of the scene lights' diffuse stays over it
;   shrink, dressed_shrink   units the body is drawn inside itself (dressed: under a fitted Elden Ring outfit)
;   layer_reach, layer_gap   a vertex with another surface of the model within layer_reach units outside it (a skirt
;             over the hips) is drawn layer_gap units inside in the finer levels (default 0: off - on a face it drew the
;             lips apart over the teeth)

[default]
levels = 2
crease = 0.5
fit = 8
keep = 1.0
max_tris = 80000
lod_near = 260.0
lod_far = 1200.0
class = "auto"
strength = 1.6
metal = 0.85
rough = 1.0
gain = 1.0
bump = 1.0
cavity = 1.0
game_light = 1.0

[creature]
lod_near = 220.0
; a beast's body is its hide: skin (with its warm falloff) over a wide band of hues - ochre ogres, green orcs and goblins;
; what reads as gold on a person is mostly an ochre hide here
strands = "fur"
gold = false
; grey, worked, shaded texels are a white pelt or bone on a beast as often as steel: metal only where a kind wears armour
grey_metal = false
skin_hue_lo = -0.05
skin_hue_hi = 0.45
skin_v_lo = 0.16
skin_s_hi = 0.95

; the people (dressed as the players are): the players' own colour bands
[creature.NPC]
strands = "hair"
gold = true
grey_metal = true
skin_hue_lo = -0.03
skin_hue_hi = 0.105
skin_v_lo = 0.42
skin_s_hi = 0.7

; the kinds in armour
[creature.Orc]
grey_metal = true

[creature.UndeadKnight]
grey_metal = true

[creature.Horsemen]
grey_metal = true

[creature.Warrior]
grey_metal = true

[creature.Minion]
grey_metal = true

; bone: dry and rough, deep in its cavities
[creature.Skeleton]
class = "stone"

[creature.Skelight]
class = "stone"

; chrome legs (an environment map under them in the game)
[creature.BlackWidow]
shiny = "metal"

; the snow beasts: a white pelt
[creature.Tormentor]
class = "auto:fur"

[creature.Vampire]
strands = "hair"
gold = true

[creature.WoodElfSoldier]
strands = "hair"
gold = true
grey_metal = true

[creature.MaleDarkElf]
strands = "hair"
gold = true
grey_metal = true

[creature.FemaleDarkElf]
strands = "hair"
gold = true
grey_metal = true

; ---- the twelve player figures (player.<class>.<n>: n the figure chosen at the start, 0..11) --------------------------
; tex<K>: the figure's K-th texture (in the order of its packets, as `RTA_REMASTER_DUMP` names them): a class, "auto",
; or "auto:<class>" (by colour; what would be leather, cloth or strands is that class - the gold, the grey metal and the
; skin painted on it stay theirs).  rules / tex<K>_rules: ["<class> hue0 hue1 sat0 sat1 val0 val1", ...] - texels in that
; colour box are that class (hue 0..1 from red; hue0 > hue1 wraps past red).

[player]
strands = "hair"

[player.barbarian.0]
tex0 = "auto:skin"
tex4 = "hair"

[player.barbarian.1]
tex0 = "auto:skin"
tex2 = "hair"

[player.berserker.10]
tex2 = "fur"
tex4_rules = ["fur 0.07 0.13 0.25 0.55 0.3 0.8"]

[player.cleric.4]
tex0 = "auto:skin"
tex1 = "auto:metal"
tex4 = "hair"

[player.cleric.5]
tex2 = "hair"

[player.ranger.2]
tex2 = "auto:leather"
tex3 = "auto:leather"
tex4 = "hair"

[player.ranger.3]
tex0 = "auto:skin"
tex1 = "hair"
tex4 = "auto:leather"

[player.shadowknight.8]
tex0 = "hair"
tex1 = "auto:metal"

[player.shadowknight.9]
tex3 = "hair"

[player.wizard.6]
grey_metal = false
tex0 = "auto:skin"
tex1 = "auto:cloth"
tex2 = "auto:cloth"

[player.wizard.7]
grey_metal = false
tex1 = "hair"
tex2 = "auto:cloth"
tex3 = "auto:cloth"
tex4 = "auto:cloth"

[player.shaman.11]
; a green, scaled people: their skin's own hue band
skin_hue_lo = 0.14
skin_hue_hi = 0.42
skin_v_lo = 0.18
skin_s_hi = 0.85
