; er_fit.cfg - our own tables for the fitted outfits of er_layer.gd / er_fit.gd (look.er_models = on, er_style = fit).
; No data of either game is in this file: class names are the game's character classes as er_layer.gd names them
; (CLASS_SETS), outfit names the folders of the player's own local models, part codes the two letters a converted
; mesh's name starts with (HD helm, BD chest and cape, AM arms, LG legs).
;
; [auto]   per class: true when its own outfit, fitted, passed the review (docs/issues/native-er-layer.md, round 4) and is
;          worn with er_outfits "auto"; an outfit's name when another one passed instead; false: the game's own figure
;          unless the player picks an outfit in Settings
; [drop]   per class, outfit or "*": parts or words of a mesh's name left out of the fitted figure
; [hands]  per class: true keeps the arm pieces' hands (gloves); left out by default (the game's hands open and grip)
; [variants] groups of mesh numbers that are alternatives of one another (only the lowest present is drawn)
; [look]   the light of every outfit piece (er_armour.gdshader's uniforms)

[auto]
barbarian = true
cleric = true
necromancer = true
ranger = true
wizard = true
; (the berserker set's wing cape spreads over the whole cat figure, hiding its back and tail: the barbarian set's cape
; passed on it instead; the berserker set stays a choice in Settings)
berserker = "barbarian"
shaman = "necromancer"

[drop]
; helms: left out for every class - each Champions figure keeps its own face, hair, ears and horns (a helm big
; enough to cover a Champions head reads as a bucket; reviewed in round 4)
* = ["HD"]
; the berserker set's loose feather cards (its wing cape stays: it is the set)
berserker = ["feather"]
; the wizard set's mantle stands up round a large head and hides it
wizard = ["Mantle"]
; the cleric set's chain skirt shows below the robe as white patches when running
cleric = ["Chain_Cloth", "chain_2side"]

[hands]

[variants]
groups = [[24, 25, 26], [27, 28], [30, 31], [32, 33], [40, 41, 42, 43], [51, 52], [53, 54], [55, 56], [57, 58]]

[look]
gain = 1.2
fill = 1.0
floor_light = 0.1
metal_amount = 0.6
sun_wrap = 0.55
sky_reflect = 0.35
