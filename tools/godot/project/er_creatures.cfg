; er_creatures.cfg - our own tables: which kind of the game's creatures is drawn as which local model family by er_layer.gd
; (look.er_creatures = on).  No data of either game is in this file: the class names and their virtual-table addresses are
; those of vtables.txt (our own reading of the program); the models are folders of the owner's local converted models
; (er-models/creatures/<model>), named by us.
;
; [classes]   a creature's class by its virtual table (object +0x48)
; [families]  class (or the level record's class name, object +0x34, which wins) = [model folder, how its joints are read]:
;             "person" - the bind-pose reader of people (er_layer.gd _auto_table: pelvis, spine, head, arms, legs);
;             "four" - the reader of four-legged skeletons (_auto_four: hips, spine, shoulders, neck, head, four legs, tail).
;             A class not named here keeps the game's own figure.

