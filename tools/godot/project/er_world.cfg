; er_world.cfg - our own choices for the Elden Ring world layer (er_world.gd, look.er_world).  No data of either game is
; in this file: classes, our numbers, level names, and texture names (the art pack's figure-palette names of ours).
;
; Classes: grass, dirt, stone, cobble, wood, metal, sand, snow (none: the texture stays as the game draws it).
; [level.<name>] holds any key of [world], [scale], [keep]

[keep]
; how much of the game's own detail (its painted designs, cracks, carvings) stays under the material's (0: none, only the
; texture's colour at a coarse scale .. 1: all of it, the material's detail laid over it)
grass = 0.45
dirt = 0.6
stone = 0.85
cobble = 0.7
wood = 0.75
metal = 0.8
sand = 0.55
snow = 0.6

[amount]
; how strong each material's detail and relief are (0: none .. 1: as the material has them)
grass = 0.9
dirt = 0.8
stone = 0.5
cobble = 0.7
wood = 0.7
metal = 0.6
sand = 0.7
snow = 0.6

[reader]
; the texture reader (rta_world.cpp): edge strength over which grey reads as cobble, how one-directional (and how strong)
; the edges of a warm texture must be to read as wood (wood_aniso: along the texture's own axes - a mine's beams 1.5..1.9,
; rock and lava swirls 1.0..1.2; wood_coherence: the brightness's structure tensor, any turn, 0.2..0.5 for all of those);
; metal: a near-colourless grey with a share of glints (texels far over its middle brightness) and a spread of brightness
; over its mean of at least metal_contrast
cobble_edge = 0.85
wood_aniso = 1.45
wood_edge = 0.25
wood_coherence = 0.6
metal_glint = 0.1
metal_contrast = 0.85
; where grass's band of hues starts (degrees: 60 yellow, 120 green)
grass_hue = 64.0

[grass]
; density: points per 1000 square units of grass-class ground (0: none); radius: units from the eye drawn; max: points
; at most; height: of a tuft, units; move: units the eye moves before the points are gathered again; ground: the share of a
; piece's area that must face up for grass to grow on it (a bush's mound, a rock: less); clear: units around a point looked
; at in the ground's texture for a painted feature (a flower patch, a stone, a path's edge) that no tuft may lean over
density = 1.2
radius = 1400.0
max = 60000.0
height = 34.0
move = 40.0
ground = 0.3
clear = 10.0

[sky]
; the cloud layer: amount 0..1, tint: how much the level's own sky colours the clouds, speed of the drift, scale
amount = 0.85
tint = 0.7
speed = 0.004
scale = 1.0

[remap]
; whole classes remapped for every level, e.g.  metal = "stone"

[level.hub]
; a floating island: its grass is a dark, grey olive (a yellowish hue the reader would take for dirt or stone)
grass_hue = 36.0
; ... and its pink stone floor, warm under the level's light, would read as dirt; it has no dirt and no boards
remap_dirt = "stone"
remap_wood = "stone"

[level.fire1]
; it has lava: read it (a glowing red to orange)
lava = 1
; volcanic ground: dark rock under an orange light, not earth
remap_dirt = "stone"

; ---- the sweep of every level (docs/issues/native-er-world.md, "Sweep"): what each level's pieces read as, put right
; where the reader is wrong for that level (a remap: the class read -> the class drawn), and what a level has not

[level.airarena]
; a floating rock with a marble dais: the dais is not snow or sand, the rock not grass
; (its sky has painted shafts of light in a see-through layer of the dome: the clouds behind it only half as strong)
sky_amount = 0.45
remap_snow = "stone"
remap_sand = "stone"
remap_grass = "stone"

