; Per-level look presets for scene_view.gd (Remastered): look keys by level name - our own light values only (shade,
; fog, bloom, light energy, brightness, contrast, saturation, sun height), no colour, texture, geometry or code of the
; game.  Picked by tools/godot/presets.py `make` from a walk through the levels (round 7, 2026-10-20); tracked so that
; every build has them.  The hand-tuning in tuning.cfg is read over this file, and user://look_presets.cfg over both.
; To pick them again: presets.py walk / make into local/, look at the sheets, then copy OUT/levels.cfg here (comments off).

