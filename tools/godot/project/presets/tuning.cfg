; Hand-tuning of the per-level look presets (scene_view.gd), read over res://presets/levels.cfg - the file that
; tools/godot/presets.py `make` picks from a walk through the levels (game output: it stays under local/).
; Only my own numbers are here: look keys by level name, nothing of the game's colours.  [*] is every level.
; Keys: shade, fog_start, fog_end, fog_amount, sun_az, sun_el, sun_gain, bloom_strength, sky_sun, light_energy,
; fill_light, brightness, contrast, saturation (scene_view.gd, "look").

[*]

; (2026-10-20, from the contact sheets of the walk: local/godot-r6/presets/sheets)
; the first level: the made preset dims it a little below the Compatibility picture of the earlier rounds - keep it bright
[hub]
brightness=1.0

; (2026-10-25, play-test) the boar fight in the first open level was too dark to read the creature against the ground:
; brighter, and the shadows leave more of a colour
[valor]
brightness=1.22
shade=0.72

; an ice field under a pale sky: the made preset lifts it until the ice is white without detail
[storm5]
brightness=0.96
bloom_strength=0.55

; fire levels under an orange clear colour: the sky glares - less colour, less glow
[fire1]
saturation=1.1
bloom_strength=0.6

[fire2]
saturation=1.1
bloom_strength=0.6

[firbonus]
saturation=1.1
bloom_strength=0.6

[firmedal]
saturation=1.1
bloom_strength=0.6
