; er_joint_map.cfg - our own table: which joint of the game's player skeleton drives which bone of another figure
; (er_layer.gd, look.er_models = on).  Joint numbers are indices into the pose the library hands over
; (rtag_skeleton: the clip's joint order); bone names are those of the figure's own skeleton.  No data of either
; game is in this file: the joints were told apart by where they sit in the bind pose (docs/issues/native-er-layer.md).
;
; [frame]           the figure's bones that give its up, forward and sides (head, toes, thighs)
; [jointsN]         for a skeleton of N joints:
;   frame_head, frame_toes, frame_left, frame_right    the game's joints for the same
;   name = [joint, aim joint, bone, aim bone]
;       the bone turns as the joint turns from the bind pose; "aim" pairs say which way each of them points in its
;       bind pose (the joint toward its aim joint, the bone toward its aim bone), so that the two rest poses can be
;       laid onto each other (an arm held out against an arm hanging down); -1 / "" for none.

[frame]
head = "Head"
toes = ["L_Toe0", "R_Toe0"]
left = "L_Thigh"
right = "R_Thigh"

; [auto]           for a skeleton with no [jointsN] row: our names -> [bone, aim bone]; which joint of the game's is which is
;                  then read from its bind pose (er_layer.gd _auto_table)
[auto]
pelvis = ["Pelvis", "Spine"]
spine = ["Spine", "Spine1"]
chest = ["Spine1", "Spine2"]
upper_chest = ["Spine2", "Neck"]
neck = ["Neck", "Head"]
head = ["Head", ""]
left_clavicle = ["L_Clavicle", "L_UpperArm"]
left_upper_arm = ["L_UpperArm", "L_Forearm"]
left_forearm = ["L_Forearm", "L_Hand"]
left_hand = ["L_Hand", "L_Finger2"]
right_clavicle = ["R_Clavicle", "R_UpperArm"]
right_upper_arm = ["R_UpperArm", "R_Forearm"]
right_forearm = ["R_Forearm", "R_Hand"]
right_hand = ["R_Hand", "R_Finger2"]
left_thigh = ["L_Thigh", "L_Calf"]
left_calf = ["L_Calf", "L_Foot"]
left_foot = ["L_Foot", "L_Toe0"]
right_thigh = ["R_Thigh", "R_Calf"]
right_calf = ["R_Calf", "R_Foot"]
right_foot = ["R_Foot", "R_Toe0"]

[joints64]
frame_head = 16
frame_toes = [6, 11]
frame_left = 2
frame_right = 7
pelvis = [1, 12, "Pelvis", "Spine"]
spine = [12, 13, "Spine", "Spine1"]
chest = [13, 14, "Spine1", "Spine2"]
upper_chest = [14, 15, "Spine2", "Neck"]
neck = [15, 16, "Neck", "Head"]
head = [16, -1, "Head", ""]
left_clavicle = [29, 30, "L_Clavicle", "L_UpperArm"]
left_upper_arm = [30, 31, "L_UpperArm", "L_Forearm"]
left_forearm = [31, 32, "L_Forearm", "L_Hand"]
left_hand = [32, 39, "L_Hand", "L_Finger2"]
right_clavicle = [43, 44, "R_Clavicle", "R_UpperArm"]
right_upper_arm = [44, 45, "R_UpperArm", "R_Forearm"]
right_forearm = [45, 46, "R_Forearm", "R_Hand"]
right_hand = [46, 53, "R_Hand", "R_Finger2"]
left_thigh = [2, 3, "L_Thigh", "L_Calf"]
left_calf = [3, 5, "L_Calf", "L_Foot"]
left_foot = [5, 6, "L_Foot", "L_Toe0"]
right_thigh = [7, 8, "R_Thigh", "R_Calf"]
right_calf = [8, 10, "R_Calf", "R_Foot"]
right_foot = [10, 11, "R_Foot", "R_Toe0"]
