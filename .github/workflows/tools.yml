name: Research tool compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tools:
    name: ${{ matrix.name }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x64, os: ubuntu-24.04, arch: x64, python: '3.13'}
          - {name: macOS Apple Silicon, os: macos-15, arch: arm64, python: '3.13'}
          - {name: macOS Intel, os: macos-15-intel, arch: x64, python: '3.13'}
          - {name: Windows x64, os: windows-2025, arch: x64, python: '3.13'}
          - {name: Windows ARM64, os: windows-11-arm, arch: arm64, python: '3.13'}
          - {name: Linux x64 latest Python, os: ubuntu-24.04, arch: x64, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Verify Python runs on the target architecture
        run: >-
          python -c "import platform; arch = platform.machine().lower();
          expected = '${{ matrix.arch }}';
          assert arch in ({'arm64', 'aarch64'} if expected == 'arm64' else {'x86_64', 'amd64'}), (expected, arch);
          print(platform.system(), arch)"
      - name: Native host setup check
        run: python tools/doctor.py --json
      - name: Test tools without game files
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Validate symbol contributions
        run: python tools/symtab.py check
      - name: Verify published coverage is current
        run: |
          python tools/coverage.py --write
          git diff --exit-code -- docs/STATUS.md
